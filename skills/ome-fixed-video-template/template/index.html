<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OME Video Template</title>
  <script>
    const bootParams = new URLSearchParams(window.location.search);
    if (bootParams.get("capture") === "1") {
      document.documentElement.classList.add("capture");
    }
    if (bootParams.has("scene")) {
      document.documentElement.classList.add("fixed-scene");
    }
  </script>
  <style>
    :root{
      --ink:#12243a;
      --muted:#617086;
      --accent:#f0642f;
      --line:rgba(18,36,58,.14);
      --glass:rgba(255,255,255,.66);
      --glass-strong:rgba(255,255,255,.82);
      --shadow:0 18px 55px rgba(63,86,121,.12);
      --radius:28px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;background:#e9eef7;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;color:var(--ink)}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    html.capture, html.capture body{width:100%;height:100%;overflow:hidden}
    html.capture body{padding:0;background:#fff}
    html.capture .player{width:100vw;height:100vh;border-radius:0;box-shadow:none}
    html.capture .scene{display:none!important;opacity:0!important;transition:none!important}
    html.capture .scene.active{display:block!important;opacity:1!important}
    html.capture .controls{display:none!important}
    html.capture .scene.active .anim-up,
    html.capture .scene.active .anim-scale,
    html.capture .scene.active .orb{animation:none!important;opacity:1!important;transform:none!important}
    html.fixed-scene .scene{transition:none!important}
    html.fixed-scene .scene.active .anim-up,
    html.fixed-scene .scene.active .anim-scale,
    html.fixed-scene .scene.active .orb{animation:none!important;opacity:1!important;transform:none!important}

    .player{
      width:min(96vw,1440px);
      aspect-ratio:16/9;
      position:relative;
      overflow:hidden;
      border-radius:24px;
      background:#fff;
      box-shadow:0 30px 90px rgba(34,50,80,.22);
    }

    .scene{
      position:absolute;inset:0;
      opacity:0;
      pointer-events:none;
      transition:opacity .55s ease;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(234,242,247,.55), transparent 30%),
        radial-gradient(circle at 72% 24%, rgba(232,230,248,.48), transparent 34%),
        radial-gradient(circle at 34% 80%, rgba(220,235,255,.36), transparent 30%),
        linear-gradient(135deg,#f7fbff 0%, #f7f8fd 44%, #eef4ff 100%);
    }
    .scene.active{opacity:1;pointer-events:auto}

    .brand{
      position:absolute;
      top:5.1%;
      left:2.6%;
      font-weight:850;
      font-size:clamp(14px,1.6vw,25px);
      letter-spacing:-.01em;
      z-index:8;
      color:#23354b;
    }

    .orb{
      position:absolute;border-radius:50%;
      filter:blur(.2px);
      opacity:.94;
      background:
        radial-gradient(circle at 30% 28%, #ead39d 0%, #cfb17b 32%, #9b8daa 68%, #5f5b73 100%);
      box-shadow:inset 0 0 26px rgba(255,255,255,.26);
      z-index:1;
    }
    .orb.o1{width:15.2vw;height:15.2vw;right:-4.8vw;top:-4.9vw}
    .orb.o2{width:8.8vw;height:8.8vw;left:-2.7vw;bottom:12.2%}
    .orb.o3{width:4.2vw;height:4.2vw;right:-1.25vw;bottom:9.2%}

    .wave{
      position:absolute;left:-4%;right:-4%;bottom:-1.1%;height:23%;
      z-index:2;opacity:.62;
    }
    .wave:before,.wave:after{
      content:"";position:absolute;left:-3%;width:106%;height:100%;
      transform-origin:center bottom;
    }
    .wave:before{
      bottom:-52%;
      border-radius:56% 44% 0 0 / 100% 100% 0 0;
      background:linear-gradient(180deg,rgba(217,226,255,.32),rgba(232,240,255,.10));
      transform:rotate(-2.5deg) scaleX(1.06);
    }
    .wave:after{
      bottom:-61%;
      border-radius:48% 52% 0 0 / 100% 100% 0 0;
      background:linear-gradient(180deg,rgba(226,234,255,.36),rgba(242,246,255,.10));
      transform:rotate(2.5deg) scaleX(1.12);
    }

    .title-wrap{
      position:absolute;left:9%;right:9%;top:8.5%;
      text-align:center;z-index:6;
    }
    .kicker{
      display:inline-flex;align-items:center;gap:.45em;
      font-size:clamp(12px,1.15vw,18px);
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:1.1%;
    }
    .page-title{
      margin:0;
      font-size:clamp(32px,4.6vw,74px);
      line-height:1.08;
      font-weight:900;
      letter-spacing:-.035em;
    }
    .page-title .accent{color:var(--accent)}
    .subtitle{
      margin:1.2% auto 0;
      max-width:72%;
      font-size:clamp(14px,1.45vw,23px);
      color:#53657a;
      line-height:1.65;
    }
    .title-line{
      width:13%;
      height:3px;
      background:var(--ink);
      margin:2% auto 0;
      opacity:.8;
    }

    .glass{
      background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.57));
      border:1px solid rgba(255,255,255,.92);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    /* COVER */
    #cover .cover-center{
      position:absolute;left:8%;right:8%;top:49.2%;
      transform:translateY(-50%);
      text-align:center;z-index:7;
    }
    #cover h1{
      margin:0;
      font-size:clamp(42px,5.3vw,84px);
      line-height:1.1;
      font-weight:950;
      letter-spacing:-.05em;
      color:#0b0d13;
    }
    #cover .cover-line{
      width:15.2%;
      height:3px;
      background:#1f2735;
      margin:5.1% auto 0;
      opacity:.92;
    }
    #cover .cover-subtitle{
      margin:2.2% auto 0;
      font-size:clamp(16px,1.65vw,27px);
      color:#52637a;
      font-weight:650;
      letter-spacing:0;
    }

    /* ARCHITECTURE */
    .arch-grid{
      position:absolute;
      left:7.2%;right:7.2%;
      top:31%;
      bottom:12.5%;
      display:grid;
      grid-template-columns:1fr 7% 1fr 7% 1.15fr;
      align-items:center;
      z-index:6;
    }
    .arch-card{
      min-height:66%;
      border-radius:var(--radius);
      padding:8% 8% 7%;
      display:flex;flex-direction:column;justify-content:center;
      position:relative;
    }
    .arch-card .step{
      width:52px;height:52px;border-radius:50%;
      display:grid;place-items:center;
      font-weight:900;font-size:21px;
      background:#fff;
      box-shadow:0 10px 30px rgba(63,86,121,.13);
      margin-bottom:7%;
    }
    .arch-card h3{margin:0;font-size:clamp(18px,2vw,31px);line-height:1.2}
    .arch-card p{margin:4% 0 0;color:var(--muted);font-size:clamp(13px,1.08vw,18px);line-height:1.6}
    .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8%}
    .chip{
      font-size:clamp(11px,.9vw,15px);
      padding:.58em .9em;border-radius:999px;
      background:rgba(245,248,255,.95);
      color:#43546a;border:1px solid rgba(91,111,145,.08);
    }
    .result-card{
      min-height:82%;
      border-radius:34px;
      padding:8% 8%;
      display:flex;flex-direction:column;justify-content:center;
    }
    .result-card .result-label{
      font-size:clamp(12px,1vw,16px);
      color:var(--accent);
      font-weight:800;letter-spacing:.06em;
      margin-bottom:5%;
    }
    .result-card h3{
      margin:0;font-size:clamp(22px,2.3vw,38px);line-height:1.2;
    }
    .result-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7%;
    }
    .mini{
      border-radius:18px;padding:13px 14px;background:rgba(255,255,255,.72);
      border:1px solid rgba(18,36,58,.07);
    }
    .mini b{display:block;font-size:clamp(12px,1vw,16px);margin-bottom:4px}
    .mini span{font-size:clamp(10px,.85vw,13px);color:var(--muted);line-height:1.45}

    .arrow{
      height:2px;background:linear-gradient(90deg,rgba(93,112,142,.18),rgba(93,112,142,.75));
      position:relative;margin:0 14%;
    }
    .arrow:after{
      content:"";position:absolute;right:-2px;top:50%;
      width:10px;height:10px;border-top:2px solid #738199;border-right:2px solid #738199;
      transform:translateY(-50%) rotate(45deg);
    }

    /* FOUR STEP */
    .steps-grid{
      position:absolute;left:5.7%;right:5.7%;top:32%;bottom:17.2%;
      display:grid;grid-template-columns:repeat(4,1fr);gap:2.1%;z-index:6;
    }
    .step-card{
      border-radius:28px;padding:8% 8% 7%;
      position:relative;
      display:flex;flex-direction:column;
      min-width:0;
    }
    .step-badge{
      width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
      font-weight:900;background:#fff;box-shadow:0 10px 30px rgba(54,74,107,.12);
      margin-bottom:9%;
      color:#24334a;
    }
    .step-card h3{font-size:clamp(16px,1.7vw,27px);margin:0 0 3%;line-height:1.2}
    .step-card .desc{font-size:clamp(11px,.9vw,15px);color:var(--muted);line-height:1.55}
    .step-icon{
      margin-top:10%;
      width:72px;height:72px;border-radius:22px;
      display:grid;place-items:center;font-size:33px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(65,88,130,.08);
    }
    .feature-list{margin-top:auto;display:grid;gap:9px;padding-top:9%}
    .feature{
      font-size:clamp(11px,.88vw,14px);
      padding:10px 12px;
      border-radius:14px;background:rgba(255,255,255,.58);
      border:1px solid rgba(61,81,113,.06);
    }
    .feedback-bar{
      position:absolute;left:18%;right:18%;bottom:7%;
      height:8.5%;border-radius:22px;z-index:7;
      display:flex;align-items:center;justify-content:center;gap:4%;
      font-size:clamp(11px,1vw,16px);
    }
    .feedback-bar b{font-size:clamp(13px,1.1vw,18px)}

    /* ROADMAP */
    .roadmap-grid{
      position:absolute;left:6%;right:6%;top:31%;bottom:17%;
      display:grid;grid-template-columns:repeat(3,1fr);gap:2.3%;z-index:6;
    }
    .road-card{
      border-radius:30px;padding:7% 7% 6%;
      display:flex;flex-direction:column;
      position:relative;
    }
    .road-top{display:flex;align-items:center;gap:12px}
    .road-num{
      width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
      font-weight:950;background:#fff;box-shadow:0 10px 30px rgba(55,75,108,.12);
    }
    .road-card h3{margin:0;font-size:clamp(17px,1.8vw,29px);line-height:1.2}
    .road-card p{color:var(--muted);font-size:clamp(11px,.93vw,15px);line-height:1.6;margin:5% 0 0}
    .road-items{
      display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:7%;
    }
    .road-item{
      min-height:76px;border-radius:16px;background:rgba(255,255,255,.62);
      border:1px solid rgba(67,88,125,.07);padding:12px;
      display:flex;flex-direction:column;justify-content:center;
    }
    .road-item b{font-size:clamp(11px,.95vw,15px)}
    .road-item span{font-size:clamp(9px,.78vw,12px);color:var(--muted);margin-top:4px;line-height:1.35}
    .deliver{
      margin-top:auto;border-radius:15px;padding:11px 13px;
      background:rgba(255,255,255,.8);
      font-size:clamp(10px,.88vw,14px);
      font-weight:700;
    }
    .timeline{
      position:absolute;left:13%;right:13%;bottom:7%;
      height:5.6%;z-index:7;display:flex;align-items:center;
    }
    .timeline:before{
      content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(65,85,118,.17)
    }
    .timeline span{
      position:relative;z-index:2;
      width:33.333%;
      text-align:center;
      font-size:clamp(10px,.86vw,14px);
      font-weight:800;
    }
    .timeline span:before{
      content:"";display:block;margin:0 auto 6px;
      width:12px;height:12px;border-radius:50%;
      background:#fff;border:3px solid #8e9cb2;
      box-shadow:0 3px 10px rgba(61,80,110,.14);
    }

    /* SOURCES */
    .sources-grid{
      position:absolute;left:6%;right:6%;top:31%;bottom:19%;
      display:grid;grid-template-columns:repeat(4,1fr);gap:1.8%;z-index:6;
    }
    .source-card{
      border-radius:26px;padding:8% 7% 7%;
      display:flex;flex-direction:column;min-width:0;
    }
    .source-card .value{
      color:var(--accent);font-size:clamp(11px,.95vw,15px);
      font-weight:850;letter-spacing:.05em;text-transform:uppercase;
      margin-bottom:7%;
    }
    .source-card h3{
      margin:0;font-size:clamp(16px,1.55vw,25px);line-height:1.24;
    }
    .source-card p{
      color:var(--muted);font-size:clamp(10px,.86vw,14px);line-height:1.62;margin:7% 0 0;
    }
    .source-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8%}
    .source-tags span{
      border-radius:999px;background:rgba(255,255,255,.72);
      border:1px solid rgba(61,81,113,.07);
      padding:.55em .78em;font-size:clamp(10px,.78vw,12px);color:#45566c;
    }
    .sources-note{
      position:absolute;left:18%;right:18%;bottom:7%;
      min-height:8%;border-radius:22px;z-index:7;
      display:flex;align-items:center;justify-content:center;
      padding:0 3%;font-size:clamp(12px,1vw,16px);line-height:1.5;color:#33465d;text-align:center;
    }

    /* WIDGET SCENES */
    .widget-grid{
      position:absolute;left:6%;right:6%;top:30%;bottom:12%;
      z-index:6;display:grid;gap:2%;
    }
    .widget-grid.grid-2{grid-template-columns:repeat(2,1fr)}
    .widget-grid.grid-3{grid-template-columns:repeat(3,1fr)}
    .widget-grid.grid-4{grid-template-columns:repeat(4,1fr)}
    .widget-grid.focus{grid-template-columns:1.08fr 1fr}
    .widget-grid.stack{grid-template-columns:1fr}
    .widget{
      border-radius:26px;padding:24px 26px;
      min-width:0;min-height:0;
      display:flex;flex-direction:column;
      overflow:hidden;
    }
    .widget .label{
      color:var(--accent);font-size:clamp(11px,.9vw,14px);
      font-weight:850;letter-spacing:.05em;text-transform:uppercase;
      margin-bottom:10px;
    }
    .widget h3{font-size:clamp(17px,1.65vw,27px);line-height:1.2;margin:0 0 10px}
    .widget p{color:var(--muted);font-size:clamp(11px,.9vw,15px);line-height:1.55;margin:0}
    .metric-value{font-size:clamp(42px,4vw,68px);font-weight:950;line-height:1;color:#13243a;margin:6px 0 12px}
    .metric-note{font-size:clamp(11px,.92vw,15px);color:var(--muted);line-height:1.45}
    .metric-trend{margin-top:22px;display:inline-flex;align-self:flex-start;border-radius:999px;background:rgba(240,100,47,.1);color:#c95127;padding:.55em .9em;font-size:clamp(10px,.86vw,13px);font-weight:800}
    .compare-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
    .compare-cell,.matrix-cell,.list-item,.timeline-item,.process-step,.stack-row{
      border-radius:16px;background:rgba(255,255,255,.66);
      border:1px solid rgba(18,36,58,.07);padding:13px 14px;
    }
    .compare-cell b,.matrix-cell b,.list-item b,.timeline-item b,.process-step b,.stack-row b{display:block;font-size:clamp(12px,1vw,16px);margin-bottom:5px}
    .compare-cell span,.matrix-cell span,.list-item span,.timeline-item span,.process-step span,.stack-row span{font-size:clamp(10px,.84vw,13px);line-height:1.42;color:var(--muted)}
    .matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}
    .list{display:grid;gap:9px;margin-top:24px}
    .list-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
    .checkmark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#12243a;color:#fff;font-size:13px;font-weight:900}
    .quote-mark{font-size:clamp(54px,5vw,84px);line-height:.72;color:rgba(240,100,47,.32);font-weight:950}
    .quote-text{font-size:clamp(22px,2.2vw,36px);line-height:1.25;color:#13243a;font-weight:850;margin-top:4px}
    .quote-source{margin-top:auto;color:var(--muted);font-size:clamp(11px,.9vw,14px)}
    .timeline-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
    .timeline-item{position:relative;padding-top:18px}
    .timeline-item:before{content:"";position:absolute;left:14px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
    .process-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
    .process-step .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 10px 26px rgba(63,86,121,.12);font-weight:900;margin-bottom:10px}
    .stack-list{display:grid;gap:10px;margin-top:24px}
    .stack-row{display:grid;grid-template-columns:18% 1fr;gap:12px;align-items:center}
    .tag-cloud{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .tag-cloud span{border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(61,81,113,.08);padding:.62em .9em;font-size:clamp(11px,.9vw,14px);color:#45566c}
    .role-grid,.signal-grid,.kpi-grid,.risk-grid,.contract-grid{display:grid;gap:12px;margin-top:18px}
    .role-grid{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
    .signal-grid{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
    .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
    .risk-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
    .contract-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-top:14px}
    .role-card,.signal-card,.kpi-card,.risk-card,.contract-card,.industry-card,.fit-card,.stack-layer,.road-gate,.loop-step{
      border-radius:16px;background:rgba(255,255,255,.68);
      border:1px solid rgba(18,36,58,.07);padding:12px 13px;min-width:0;
    }
    .role-card b,.signal-card b,.kpi-card b,.risk-card b,.contract-card b,.industry-card b,.fit-card b,.stack-layer b,.road-gate b,.loop-step b{
      display:block;font-size:clamp(12px,1vw,16px);margin-bottom:5px;
    }
    .role-card span,.signal-card span,.kpi-card span,.risk-card span,.contract-card span,.industry-card span,.fit-card span,.stack-layer span,.road-gate span,.loop-step span{
      display:block;font-size:clamp(10px,.82vw,13px);line-height:1.38;color:var(--muted);
    }
    .role-code{display:inline-flex;margin-top:8px;border-radius:999px;padding:.38em .7em;background:rgba(18,36,58,.07);font-size:clamp(9px,.75vw,12px);font-weight:800;color:#31445c}
    .loop-wrap{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px;align-items:stretch}
    .loop-step{position:relative;text-align:center}
    .loop-step:after{content:"";position:absolute;right:-9px;top:50%;width:12px;height:2px;background:rgba(240,100,47,.34)}
    .loop-step:last-child:after{display:none}
    .loop-center{margin:18px auto 0;border-radius:999px;background:#12243a;color:#fff;padding:.72em 1.2em;font-weight:900;font-size:clamp(12px,1vw,16px)}
    .solution-stack{display:grid;gap:10px;margin-top:18px}
    .stack-layer{display:grid;grid-template-columns:18% 1fr 26%;gap:14px;align-items:center}
    .layer-num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 10px 26px rgba(63,86,121,.12);font-weight:900}
    .layer-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
    .layer-tags em{font-style:normal;border-radius:999px;background:rgba(240,100,47,.08);color:#be4d25;padding:.38em .62em;font-size:clamp(9px,.74vw,11px)}
    .industry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-top:18px}
    .industry-card{min-height:92px}
    .industry-card small{display:block;color:var(--accent);font-size:clamp(9px,.72vw,11px);font-weight:850;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
    .fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    .fit-card.good{border-color:rgba(33,128,92,.18)}
    .fit-card.bad{border-color:rgba(192,70,55,.18)}
    .fit-card .mark{display:inline-flex;margin-bottom:8px;border-radius:999px;padding:.42em .78em;font-size:clamp(10px,.78vw,12px);font-weight:900}
    .fit-card.good .mark{background:rgba(33,128,92,.1);color:#207656}
    .fit-card.bad .mark{background:rgba(192,70,55,.1);color:#b04737}
    .kpi-value{font-size:clamp(22px,2.1vw,34px);font-weight:950;color:#13243a;line-height:1.05;margin:6px 0}
    .risk-level{display:inline-flex;border-radius:999px;padding:.38em .68em;margin-bottom:8px;font-size:clamp(9px,.75vw,12px);font-weight:900;background:rgba(240,100,47,.1);color:#c95127}
    .contract-card ul{margin:8px 0 0;padding-left:1.1em;color:var(--muted);font-size:clamp(10px,.8vw,12px);line-height:1.45}
    .roadmap-gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:18px}
    .road-gate{position:relative;min-height:118px}
    .road-gate:before{content:"";position:absolute;left:14px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
    .road-gate b{padding-top:16px}

    /* ENDING */
    #ending .ending-center{
      position:absolute;left:10%;right:10%;top:25%;transform:translateY(-50%);
      text-align:center;z-index:7;
    }
    #ending h2{
      margin:0;font-size:clamp(38px,5vw,80px);letter-spacing:-.04em;
    }
    #ending p{
      font-size:clamp(15px,1.5vw,23px);color:var(--muted);margin:2% 0 0;
    }
    .ending-visual{
      position:absolute;left:8%;right:8%;top:42%;bottom:9%;
      z-index:6;border-radius:30px;padding:2.8% 4%;
      display:grid;grid-template-columns:1fr 1.25fr;gap:4%;align-items:center;
    }
    .flywheel{
      position:relative;width:min(33vw,430px);aspect-ratio:1;margin:auto;
    }
    .flywheel-center{
      position:absolute;inset:31%;border-radius:50%;display:grid;place-items:center;
      background:#12243a;color:#fff;font-size:clamp(19px,2vw,33px);font-weight:900;
      box-shadow:0 18px 45px rgba(18,36,58,.22);
    }
    .flywheel-ring{
      position:absolute;width:35%;height:35%;border-radius:50%;
      display:grid;place-items:center;text-align:center;padding:8px;
      background:rgba(255,255,255,.84);border:1px solid rgba(18,36,58,.08);
      box-shadow:0 12px 34px rgba(63,86,121,.13);
      font-size:clamp(12px,1vw,16px);font-weight:850;color:#263a52;
    }
    .flywheel-ring.r1{left:32.5%;top:0}
    .flywheel-ring.r2{right:0;top:32.5%}
    .flywheel-ring.r3{left:32.5%;bottom:0}
    .flywheel-ring.r4{left:0;top:32.5%}
    .flywheel-line{
      position:absolute;inset:17%;border:3px solid rgba(240,100,47,.28);
      border-radius:50%;border-left-color:rgba(18,36,58,.13);
      transform:rotate(28deg);
    }
    .ending-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .ending-item{
      border-radius:18px;padding:17px 18px;background:rgba(255,255,255,.72);
      border:1px solid rgba(18,36,58,.07);min-height:92px;
      display:flex;flex-direction:column;justify-content:center;
    }
    .ending-item b{font-size:clamp(14px,1.2vw,20px);margin-bottom:8px}
    .ending-item span{font-size:clamp(11px,.9vw,15px);line-height:1.45;color:var(--muted)}

    /* CONTROL */
    .controls{
      position:absolute;left:50%;bottom:1%;transform:translateX(-50%) scale(.9);
      transform-origin:center bottom;
      z-index:20;display:flex;gap:8px;padding:7px 9px;
      border-radius:999px;background:rgba(15,26,43,.76);backdrop-filter:blur(14px);
    }
    .controls button{
      border:0;color:#fff;background:rgba(255,255,255,.13);
      border-radius:999px;padding:8px 12px;font-size:12px;cursor:pointer
    }
    .controls button:hover{background:rgba(255,255,255,.23)}
    .controls .status{
      color:#dbe4f0;font-size:12px;display:flex;align-items:center;padding:0 5px;
      min-width:80px;justify-content:center;
    }

    html:not(.capture) .feedback-bar{bottom:10%;height:7.2%}
    html:not(.capture) #fourstep .steps-grid{bottom:20%}
    html:not(.capture) #fourstep .step-card{padding:6.5% 7% 6%}
    html:not(.capture) #fourstep .step-badge{width:42px;height:42px;margin-bottom:6%}
    html:not(.capture) #fourstep .step-icon{width:58px;height:58px;border-radius:18px;margin-top:7%;font-size:26px}
    html:not(.capture) #fourstep .feature-list{gap:7px;padding-top:6%}
    html:not(.capture) #fourstep .feature{padding:8px 10px;font-size:clamp(10px,.82vw,13px)}
    html:not(.capture) .widget-grid{bottom:13.5%}
    html:not(.capture) .risk-grid{gap:7px}
    html:not(.capture) .risk-card{padding:9px 11px}
    html:not(.capture) .risk-card b{font-size:clamp(11px,.9vw,14px);margin-bottom:3px}
    html:not(.capture) .risk-card span{font-size:clamp(9px,.76vw,12px);line-height:1.28}
    html:not(.capture) .risk-level{padding:.28em .58em;margin-bottom:5px;font-size:clamp(8px,.68vw,11px)}

    /* motion */
    .scene.active .anim-up{animation:up .75s cubic-bezier(.2,.8,.2,1) both}
    .scene.active .anim-up.d2{animation-delay:.14s}
    .scene.active .anim-up.d3{animation-delay:.28s}
    .scene.active .anim-up.d4{animation-delay:.42s}
    .scene.active .anim-scale{animation:scale .72s cubic-bezier(.2,.8,.2,1) both}
    .scene.active .anim-scale.d2{animation-delay:.14s}
    .scene.active .anim-scale.d3{animation-delay:.28s}
    .scene.active .anim-scale.d4{animation-delay:.42s}
    .scene.active .orb{animation:float 8s ease-in-out infinite alternate}
    .scene.active .orb.o2{animation-delay:-1.8s}
    .scene.active .orb.o3{animation-delay:-3.2s}
    @keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
    @keyframes float{from{transform:translateY(-8px) translateX(0)}to{transform:translateY(10px) translateX(5px)}}

    @media(max-width:900px){
      body{padding:0}
      html:not(.capture),html:not(.capture) body{height:100%;overflow:hidden}
      html:not(.capture) .player{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
      html:not(.capture) .widget-grid{left:5.4%;right:5.4%;top:25%;bottom:15.5%;gap:12px}
      html:not(.capture) #fourstep .steps-grid{left:5.4%;right:5.4%;top:31%;bottom:21%}
      html:not(.capture) .widget{border-radius:24px;padding:18px}
      html:not(.capture) .page-title{font-size:clamp(28px,7vw,48px)}
      html:not(.capture) .subtitle{font-size:clamp(12px,2.7vw,17px);max-width:88%}
      html:not(.capture) .feedback-bar{left:5.4%;right:5.4%;bottom:10.5%;height:6.5%}
      html:not(.capture) .controls{bottom:1.2%;transform:translateX(-50%) scale(.82)}
      html:not(.capture) .risk-grid{gap:7px;margin-top:10px}
      html:not(.capture) .contract-grid{gap:7px;margin-top:10px}
      html:not(.capture) .risk-card,html:not(.capture) .contract-card{border-radius:13px;padding:8px 10px}
    }
  </style>
</head>

<body>
  <main class="player" id="player">

    <!-- Scene 1: Cover -->
    <section class="scene active" id="cover" data-duration="4.5">
      <div class="brand" data-bind="brand"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="wave"></div>

      <div class="cover-center">
        <h1 class="anim-up" data-bind="coverTitle"></h1>
        <p class="cover-subtitle anim-up d2" data-bind="coverSubtitle"></p>
        <div class="cover-line anim-scale d2"></div>
      </div>
    </section>

    <!-- Scene 2: Architecture -->
    <section class="scene" id="architecture" data-duration="8">
      <div class="brand" data-bind="brand"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="wave"></div>

      <header class="title-wrap">
        <div class="kicker anim-up" data-bind="architecture.kicker"></div>
        <h2 class="page-title anim-up d2" data-html="architecture.title"></h2>
        <div class="subtitle anim-up d3" data-bind="architecture.subtitle"></div>
      </header>

      <div class="arch-grid">
        <article class="arch-card glass anim-scale" id="arch1"></article>
        <div class="arrow anim-scale d2"></div>
        <article class="arch-card glass anim-scale d2" id="arch2"></article>
        <div class="arrow anim-scale d3"></div>
        <article class="result-card glass anim-scale d4" id="archResult"></article>
      </div>
    </section>

    <!-- Scene 3: Four Step -->
    <section class="scene" id="fourstep" data-duration="8">
      <div class="brand" data-bind="brand"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="wave"></div>

      <header class="title-wrap">
        <div class="kicker anim-up" data-bind="fourStep.kicker"></div>
        <h2 class="page-title anim-up d2" data-html="fourStep.title"></h2>
        <div class="subtitle anim-up d3" data-bind="fourStep.subtitle"></div>
      </header>

      <div class="steps-grid" id="stepsGrid"></div>
      <div class="feedback-bar glass anim-up d4" id="feedbackBar"></div>
    </section>

    <!-- Scene 4: Roadmap -->
    <section class="scene" id="roadmap" data-duration="8">
      <div class="brand" data-bind="brand"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="wave"></div>

      <header class="title-wrap">
        <div class="kicker anim-up" data-bind="roadmap.kicker"></div>
        <h2 class="page-title anim-up d2" data-html="roadmap.title"></h2>
        <div class="subtitle anim-up d3" data-bind="roadmap.subtitle"></div>
      </header>

      <div class="roadmap-grid" id="roadmapGrid"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- Scene 5: Ending -->
    <section class="scene" id="ending" data-duration="7">
      <div class="brand" data-bind="brand"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="wave"></div>

      <div class="ending-center">
        <h2 class="anim-up" data-bind="ending.title"></h2>
        <p class="anim-up d2" data-bind="ending.subtitle"></p>
      </div>
      <div class="ending-visual glass anim-scale d3" id="endingVisual"></div>
    </section>

    <!-- Scene 6: Data Sources -->
    <section class="scene" id="sources" data-duration="4">
      <div class="brand" data-bind="brand"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      <div class="wave"></div>

      <header class="title-wrap">
        <div class="kicker anim-up" data-bind="dataSources.kicker"></div>
        <h2 class="page-title anim-up d2" data-html="dataSources.title"></h2>
        <div class="subtitle anim-up d3" data-bind="dataSources.subtitle"></div>
      </header>

      <div class="sources-grid" id="sourcesGrid"></div>
      <div class="sources-note glass anim-up d4" data-bind="dataSources.note"></div>
    </section>

    <div id="extraScenes"></div>

    <div class="controls">
      <button id="prev">上一頁</button>
      <button id="play">播放</button>
      <button id="next">下一頁</button>
      <div class="status" id="status">1 / 6</div>
    </div>
  </main>

  <script src="./data.js"></script>
  <script>
    const DATA = window.OME_VIDEO_DATA;

    const bind = (path) => path.split('.').reduce((o,k)=>o?.[k], DATA);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);
    const html = (value) => value ?? "";

    function widgetCard(body, index, className = "") {
      return `<article class="widget glass anim-scale d${Math.min(index + 1, 4)} ${className}">${body}</article>`;
    }

    function renderPairs(items = [], className = "matrix-cell") {
      return items.map((item) => {
        const title = Array.isArray(item) ? item[0] : item.title;
        const text = Array.isArray(item) ? item[1] : item.text;
        return `<div class="${className}"><b>${esc(title)}</b><span>${esc(text)}</span></div>`;
      }).join("");
    }

    function renderTags(items = []) {
      return items.map((item) => `<em>${esc(item)}</em>`).join("");
    }

    function renderRoleComparison(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="role-grid">${(widget.roles || widget.items || []).map((role) => `
          <div class="role-card">
            <b>${esc(role.title)}</b>
            <span>${esc(role.goal)}</span>
            <i class="role-code">${esc(role.code || role.kpi || "")}</i>
          </div>
        `).join("")}</div>`, index);
    }

    function renderDeliveryLoop(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="loop-wrap">${(widget.steps || widget.items || []).map((step, i) => `
          <div class="loop-step"><b>${esc(step.title ?? step[0])}</b><span>${esc(step.text ?? step[1])}</span></div>
        `).join("")}</div>
        <div class="loop-center">${esc(widget.center || "Production impact")}</div>`, index);
    }

    function renderSolutionStack(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="solution-stack">${(widget.layers || widget.items || []).map((layer, i) => `
          <div class="stack-layer">
            <div class="layer-num">${esc(layer.n ?? i + 1)}</div>
            <div><b>${esc(layer.title ?? layer[0])}</b><span>${esc(layer.text ?? layer[1])}</span></div>
            <div class="layer-tags">${renderTags(layer.tags || [])}</div>
          </div>
        `).join("")}</div>`, index);
    }

    function renderIndustryMatrix(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="industry-grid">${(widget.industries || widget.items || []).map((item) => `
          <div class="industry-card"><small>${esc(item.kpi || item.metric || "")}</small><b>${esc(item.industry || item.title)}</b><span>${esc(item.solution || item.text)}</span></div>
        `).join("")}</div>`, index);
    }

    function renderMarketSignals(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="signal-grid">${(widget.signals || widget.items || []).map((item) => `
          <div class="signal-card"><b>${esc(item.name || item.title)}</b><span>${esc(item.signal || item.text)}</span><i class="role-code">${esc(item.note || "")}</i></div>
        `).join("")}</div>`, index);
    }

    function renderFitChecker(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="fit-grid">
          <div class="fit-card good"><div class="mark">${esc(widget.yesLabel || "FIT")}</div>${renderPairs(widget.fit || [], "list-item")}</div>
          <div class="fit-card bad"><div class="mark">${esc(widget.noLabel || "NO FIT")}</div>${renderPairs(widget.noFit || [], "list-item")}</div>
        </div>`, index);
    }

    function renderKpiScorecard(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="kpi-grid">${(widget.kpis || widget.items || []).map((kpi) => `
          <div class="kpi-card"><b>${esc(kpi.title)}</b><div class="kpi-value">${esc(kpi.value)}</div><span>${esc(kpi.text)}</span></div>
        `).join("")}</div>`, index);
    }

    function renderRiskRegister(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="risk-grid">${(widget.risks || widget.items || []).map((risk) => `
          <div class="risk-card"><div class="risk-level">${esc(risk.level || "RISK")}</div><b>${esc(risk.title)}</b><span>${esc(risk.text)}</span></div>
        `).join("")}</div>`, index);
    }

    function renderContractChecklist(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="contract-grid">${(widget.groups || widget.items || []).map((group) => `
          <div class="contract-card"><b>${esc(group.title)}</b><ul>${(group.items || []).map((item) => `<li>${esc(item)}</li>`).join("")}</ul></div>
        `).join("")}</div>`, index);
    }

    function renderSprintRoadmap(widget, index) {
      return widgetCard(`${widgetHeader(widget)}
        <div class="roadmap-gates">${(widget.gates || widget.items || []).map((gate) => `
          <div class="road-gate"><b>${esc(gate.title)}</b><span>${esc(gate.text)}</span></div>
        `).join("")}</div>`, index);
    }

    function widgetHeader(widget) {
      const label = widget.label ? `<div class="label">${esc(widget.label)}</div>` : "";
      const title = widget.title ? `<h3>${esc(widget.title)}</h3>` : "";
      const desc = widget.desc ? `<p>${esc(widget.desc)}</p>` : "";
      return `${label}${title}${desc}`;
    }

    function renderWidget(widget, index) {
      const type = widget.type || "text";
      const label = widget.label ? `<div class="label">${esc(widget.label)}</div>` : "";
      const title = widget.title ? `<h3>${esc(widget.title)}</h3>` : "";
      const desc = widget.desc ? `<p>${esc(widget.desc)}</p>` : "";
      if (type === "role-comparison") return renderRoleComparison(widget, index);
      if (type === "delivery-loop") return renderDeliveryLoop(widget, index);
      if (type === "solution-stack") return renderSolutionStack(widget, index);
      if (type === "industry-matrix") return renderIndustryMatrix(widget, index);
      if (type === "market-signals") return renderMarketSignals(widget, index);
      if (type === "fit-checker") return renderFitChecker(widget, index);
      if (type === "kpi-scorecard") return renderKpiScorecard(widget, index);
      if (type === "risk-register") return renderRiskRegister(widget, index);
      if (type === "contract-checklist") return renderContractChecklist(widget, index);
      if (type === "sprint-roadmap") return renderSprintRoadmap(widget, index);
      if (type === "metric") {
        return widgetCard(`
          ${label}${title}
          <div class="metric-value">${esc(widget.value)}</div>
          <div class="metric-note">${esc(widget.note)}</div>
          ${widget.trend ? `<div class="metric-trend">${esc(widget.trend)}</div>` : ""}
        `, index);
      }
      if (type === "comparison") {
        return widgetCard(`${label}${title}${desc}<div class="compare-row">${renderPairs(widget.items, "compare-cell")}</div>`, index);
      }
      if (type === "matrix") {
        return widgetCard(`${label}${title}${desc}<div class="matrix">${renderPairs(widget.items, "matrix-cell")}</div>`, index);
      }
      if (type === "checklist") {
        return widgetCard(`${label}${title}${desc}<div class="list">${(widget.items || []).map((item) => `
          <div class="list-item"><div class="checkmark">✓</div><div><b>${esc(item.title ?? item[0] ?? item)}</b><span>${esc(item.text ?? item[1] ?? "")}</span></div></div>
        `).join("")}</div>`, index);
      }
      if (type === "quote") {
        return widgetCard(`${label}<div class="quote-mark">“</div><div class="quote-text">${esc(widget.text)}</div><div class="quote-source">${esc(widget.source)}</div>`, index);
      }
      if (type === "timeline") {
        return widgetCard(`${label}${title}${desc}<div class="timeline-list">${renderPairs(widget.items, "timeline-item")}</div>`, index);
      }
      if (type === "process") {
        return widgetCard(`${label}${title}${desc}<div class="process-list">${(widget.items || []).map((item, i) => `
          <div class="process-step"><div class="num">${esc(item.n ?? i + 1)}</div><b>${esc(item.title ?? item[0])}</b><span>${esc(item.text ?? item[1])}</span></div>
        `).join("")}</div>`, index);
      }
      if (type === "stack") {
        return widgetCard(`${label}${title}${desc}<div class="stack-list">${renderPairs(widget.items, "stack-row")}</div>`, index);
      }
      if (type === "tags") {
        return widgetCard(`${label}${title}${desc}<div class="tag-cloud">${(widget.items || []).map((item) => `<span>${esc(item)}</span>`).join("")}</div>`, index);
      }
      return widgetCard(`${label}${title}${desc}`, index);
    }

    function renderExtraScenes() {
      const mount = document.getElementById("extraScenes");
      const scenes = DATA.extraScenes || DATA.widgetScenes || [];
      mount.innerHTML = scenes.map((scene, sceneIndex) => `
        <section class="scene widget-scene" id="extra-${sceneIndex + 1}" data-duration="${esc(scene.duration || 8)}">
          <div class="brand">${esc(DATA.brand)}</div>
          <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
          <div class="wave"></div>
          <header class="title-wrap">
            <div class="kicker anim-up">${esc(scene.kicker)}</div>
            <h2 class="page-title anim-up d2">${html(scene.title)}</h2>
            <div class="subtitle anim-up d3">${esc(scene.subtitle)}</div>
          </header>
          <div class="widget-grid ${esc(scene.layout || "grid-3")}">
            ${(scene.widgets || []).map((widget, index) => renderWidget(widget, index)).join("")}
          </div>
        </section>
      `).join("");
    }

    renderExtraScenes();
    if (!DATA.dataSources) {
      document.getElementById("sources")?.remove();
    }

    document.querySelectorAll("[data-bind]").forEach(el=>{
      el.textContent = bind(el.dataset.bind) ?? "";
    });
    document.querySelectorAll("[data-html]").forEach(el=>{
      el.innerHTML = bind(el.dataset.html) ?? "";
    });

    // Architecture
    DATA.architecture.cards.forEach((c,i)=>{
      const el = document.getElementById("arch"+(i+1));
      el.innerHTML = `
        <div class="step">${c.step}</div>
        <h3>${c.title}</h3>
        <p>${c.desc}</p>
        <div class="chips">${c.chips.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
      `;
    });
    document.getElementById("archResult").innerHTML = `
      <div class="result-label">${DATA.architecture.result.label}</div>
      <h3>${DATA.architecture.result.title}</h3>
      <div class="result-grid">
        ${DATA.architecture.result.items.map(i=>`
          <div class="mini"><b>${i[0]}</b><span>${i[1]}</span></div>
        `).join("")}
      </div>
    `;

    // Four step
    document.getElementById("stepsGrid").innerHTML = DATA.fourStep.steps.map((s,i)=>`
      <article class="step-card glass anim-scale d${Math.min(i+1,4)}">
        <div class="step-badge">${s.n}</div>
        <h3>${s.title}</h3>
        <div class="desc">${s.desc}</div>
        <div class="step-icon">${s.icon}</div>
        <div class="feature-list">${s.features.map(f=>`<div class="feature">${f}</div>`).join("")}</div>
      </article>
    `).join("");
    document.getElementById("feedbackBar").innerHTML =
      `<b>${DATA.fourStep.feedback[0]}</b>` +
      DATA.fourStep.feedback.slice(1).map(x=>`<span>${x}</span>`).join("");

    // Roadmap
    document.getElementById("roadmapGrid").innerHTML = DATA.roadmap.stages.map((s,i)=>`
      <article class="road-card glass anim-scale d${Math.min(i+1,4)}">
        <div class="road-top"><div class="road-num">${s.n}</div><h3>${s.title}</h3></div>
        <p>${s.desc}</p>
        <div class="road-items">
          ${s.items.map(x=>`<div class="road-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}
        </div>
        <div class="deliver">${s.deliver}</div>
      </article>
    `).join("");
    document.getElementById("timeline").innerHTML =
      DATA.roadmap.timeline.map(x=>`<span>${x}</span>`).join("");

    // Data sources
    if (DATA.dataSources) {
      document.getElementById("sourcesGrid").innerHTML = DATA.dataSources.cards.map((s,i)=>`
        <article class="source-card glass anim-scale d${Math.min(i+1,4)}">
          <div class="value">${s.value}</div>
          <h3>${s.title}</h3>
          <p>${s.desc}</p>
          <div class="source-tags">${s.tags.map(t=>`<span>${t}</span>`).join("")}</div>
        </article>
      `).join("");
    }

    // Ending visual
    if (DATA.ending.visual) {
      const v = DATA.ending.visual;
      document.getElementById("endingVisual").innerHTML = `
        <div class="flywheel">
          <div class="flywheel-line"></div>
          <div class="flywheel-center">${v.center}</div>
          ${v.rings.map((x,i)=>`<div class="flywheel-ring r${i+1}">${x}</div>`).join("")}
        </div>
        <div class="ending-list">
          ${v.items.map(i=>`<div class="ending-item"><b>${i[0]}</b><span>${i[1]}</span></div>`).join("")}
        </div>
      `;
    }

    // Player
    const scenes = [...document.querySelectorAll(".scene")];
    let current = 0;
    let playing = false;
    let timer = null;

    function showScene(index){
      scenes[current].classList.remove("active");
      current = (index + scenes.length) % scenes.length;
      // force animation restart
      const s = scenes[current];
      s.classList.remove("active");
      void s.offsetWidth;
      s.classList.add("active");
      document.getElementById("status").textContent = `${current+1} / ${scenes.length}`;
    }

    function scheduleNext(){
      if(!playing) return;
      const duration = parseFloat(scenes[current].dataset.duration || "6") * 1000;
      clearTimeout(timer);
      timer = setTimeout(()=>{
        showScene(current+1);
        scheduleNext();
      }, duration);
    }

    document.getElementById("prev").onclick = ()=>{ showScene(current-1); if(playing) scheduleNext(); };
    document.getElementById("next").onclick = ()=>{ showScene(current+1); if(playing) scheduleNext(); };
    document.getElementById("play").onclick = ()=>{
      playing = !playing;
      document.getElementById("play").textContent = playing ? "暫停" : "播放";
      if(playing) scheduleNext(); else clearTimeout(timer);
    };

    document.addEventListener("keydown",e=>{
      if(e.key==="ArrowRight") document.getElementById("next").click();
      if(e.key==="ArrowLeft") document.getElementById("prev").click();
      if(e.key===" ") { e.preventDefault(); document.getElementById("play").click(); }
    });

    const params = new URLSearchParams(window.location.search);
    const fixedScene = Number(params.get("scene"));
    if (params.get("capture") === "1") {
      document.querySelector(".controls").style.display = "none";
    }
    if (Number.isInteger(fixedScene) && fixedScene >= 1 && fixedScene <= scenes.length) {
      showScene(fixedScene - 1);
    }
  </script>
</body>
</html>
